<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/import.css">
    <link rel="stylesheet" href="/src/css/business/style.css">
    <title>Business</title>
</head>

<body>
    <header>
        <div class="agendaPro">
            <svg viewBox="0 0 24 24" fill="none" width="20px">
                <rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="2" />
                <path d="M8 2V6M16 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M3 10H21" stroke="currentColor" stroke-width="2" />
                <path d="M8 15L10.5 17.5L16 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <h2>Agenda<span>Pro</span></h2>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="/index.html#home">Iníco</a></li>
                <li><a href="/index.html#categoria">Categoria</a></li>
                <li><a href="/index.html#destaque">Destaque</a></li>
                <li><a href="/index.html#profissional">Para profissionais</a></li>
            </ul>
        </nav>
        <div class="loginCadastro perfil">
            <button type="button" class="login">Entrar</button>
            <button type="button" class="cadastro">Cadastrar-se</button>
        </div>
    </header>
    <main class="container">
        <section class="banner">
            <div class="caminho">
                <nav aria-label="Navegação">
                    <ul>
                        <li>
                            <a href="/index.html#home">
                                Início
                            </a>
                        </li>
                        <li>
                            <a href="/index.html#barbearia">
                                Barbearia
                            </a>
                        </li>
                        <li aria-current="page"></li>
                    </ul>
                </nav>
            </div>
            <div class="perfil">
                <div class="perfil-foto"></div>
                <div class="perfil-info">
                    <div class="box-info">
                        <h2>Barbearia Alpha</h2>
                        <svg viewBox="0 0 24 24" fill="none" width="20px">
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                            <path d="M8 12L11 15L16 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <span>4.8 (120 avaliações)</span>
                    <div class="box-location">
                        <svg viewBox="0 0 24 24" fill="none" width="14px">
                            <path d="M12 21C12 21 19 14 19 9
                                                 C19 5.1 15.9 2 12 2
                                                 C8.1 2 5 5.1 5 9
                                                 C5 14 12 21 12 21Z" stroke="currentColor" stroke-width="2" />
                            <circle cx="12" cy="9" r="2" stroke="currentColor" stroke-width="2" />
                        </svg>
                        <p>Luanda, Angola | <span>Barbearia</span></p>
                    </div>
                    <p>Mais que um corte, é confiança em cada detalhe.</p>
                </div>
            </div>
            <button type="button">Ver mais fotos</button>
        </section>
    </main>
</body>

</html>
